name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          cache-dependency-path: engine/go.mod
      - name: Go vet & build
        run: |
          cd engine
          go vet ./...
          go build ./...

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install UI dependencies
        run: npm ci --prefix ui-tauri
      # bundle.resources 引用的引擎二进制不入库，检查时放占位文件
      - name: Placeholder engine binary
        shell: bash
        run: echo placeholder > ui-tauri/src-tauri/localmap-engine.exe
      - name: Cargo check
        run: cargo check --manifest-path ui-tauri/src-tauri/Cargo.toml
